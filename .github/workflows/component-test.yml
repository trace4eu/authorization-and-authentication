name: TRACE4EU Authorization and Authentication Tests

on:
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master, test ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests jwcrypto python-dotenv allure-pytest
      
      - name: Create necessary directories
        run: |
          mkdir -p compose/config/oathkeeper
          mkdir -p compose/config/hydra
          mkdir -p test

      - name: Generate JWT and JWKS files
        run: |
          python scripts/generate_api_jwt_test.py
        
      - name: Check generated files
        run: |
          ls -la compose/config/oathkeeper/
          cat compose/config/oathkeeper/jwks.json
          ls -la test/
          cat test/.env
      
      - name: Start services with Docker Compose
        run: |
          docker compose -f compose/authorization-and-authentication-test.yml up -d
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 3
      
      - name: Check running containers
        run: docker ps
      
      - name: Run tests with Allure reporting
        run: |
          python -m pytest test/test.py --alluredir allure-results

      - name: Generate Allure Report using action
        if: always()
        uses: simple-elf/allure-report-action@v1.7 # Use the combined action
        with:
          # Specify the location of the results
          allure_results: allure-results
          # Specify the desired output directory name
          gh_pages: allure-report 

      # - name: Generate Allure Report
      #   if: always() # Run even if tests fail
      #   run: allure generate ./allure-results --clean -o ./allure-report
  
      - name: Upload Allure Report as Artifact
        if: always() # Upload report even if tests failed
        uses: actions/upload-artifact@v4 # Use standard artifact upload
        with:
          name: allure-report # Name of the artifact zip file
          path: ./allure-report # Directory to upload    

      - name: Stop containers
        if: always()
        run: docker compose -f compose/authorization-and-authentication-test.yml down
